[package]
name = "esslinger-mesh-cw721"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CW721-compatible NFT collection for Esslinger Cyberspace (nexus-qcoin-1). Not audited."
rust-version = "1.81"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
incremental = false

[dependencies]
cosmwasm-std = { version = "2.2", default-features = false, features = ["std", "iterator", "abort"] }
cosmwasm-schema = "2.2"
cw-storage-plus = "2.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
