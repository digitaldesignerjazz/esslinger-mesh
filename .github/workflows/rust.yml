name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - contracts/amm
          - contracts/nft
          - contracts/nft-market
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ matrix.dir }}
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --locked --verbose

  wasm:
    name: wasm32 (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - contracts/amm
          - contracts/nft
          - contracts/nft-market
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ matrix.dir }}
    # contracts/.cargo/config.toml supplies the CosmWasm link args for wasm32
    - name: Build wasm (release)
      run: cargo build --locked --release --lib --target wasm32-unknown-unknown
    - name: Report wasm size
      run: ls -l target/wasm32-unknown-unknown/release/*.wasm

  clippy:
    name: clippy (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - contracts/amm
          - contracts/nft
          - contracts/nft-market
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ matrix.dir }}
    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings
